name: 'Setup Rust CI'
description: |
  Sets up the Rust toolchain, sccache, the mold linker, cargo-nextest, and the
  swatinem/rust-cache. Used by Rust test and measurement-sync jobs on fresh
  GitHub-hosted runners.

  Mold's checksum-verified release binaries are placed in a job-specific
  directory on PATH; no sudo or host-wide installation is needed.

inputs:
  cache-key:
    description: 'Suffix for the swatinem/rust-cache key (per-job isolation).'
    required: true
  components:
    description: 'Extra Rust components (e.g. "rustfmt, clippy").'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        components: ${{ inputs.components }}
        # Preserve v1's default before Cargo 1.97; caller-provided RUSTFLAGS win.
        rustflags: "-D warnings"

    # Hosted images can include cargo tools; download them only when the
    # pinned version is missing. The pins live only in this step's env;
    # the install steps read them from its outputs.
    - name: Check cached cargo tools
      id: tools
      shell: bash
      run: |
        echo "nextest-version=${NEXTEST_VERSION}" >> "$GITHUB_OUTPUT"
        echo "sccache-version=${SCCACHE_VERSION}" >> "$GITHUB_OUTPUT"
        if cargo nextest --version 2>/dev/null | grep -q "cargo-nextest ${NEXTEST_VERSION}"; then
          echo "nextest=true" >> "$GITHUB_OUTPUT"
        fi
        if sccache --version 2>/dev/null | grep -q "sccache ${SCCACHE_VERSION}"; then
          echo "sccache=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        NEXTEST_VERSION: 0.9.150
        SCCACHE_VERSION: 0.19.0

    - name: Install cargo-nextest
      if: steps.tools.outputs.nextest != 'true'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: nextest@${{ steps.tools.outputs.nextest-version }}

    - name: Install sccache
      if: steps.tools.outputs.sccache != 'true'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: sccache@${{ steps.tools.outputs.sccache-version }}

    - name: Install mold linker
      shell: bash
      run: | # zizmor: ignore[github-env] PATH receives only a local mktemp directory containing the checksum-verified linker.
        set -euo pipefail
        MOLD_VERSION=2.41.0
        ARCH=$(uname -m)
        # Release asset SHA256 values from rui314/mold v2.41.0.
        case "$ARCH" in
          x86_64) SHA256=a3696680d99e692970590a178bc3a33d78d60d1c6dc9db7a11b557b02b751f5d ;;
          aarch64) SHA256=946de2774b06a71346bd59b55fddba610b65b8d93c3a4a1559cc84e103472710 ;;
          *) echo "Unsupported arch for mold: $ARCH" >&2; exit 1 ;;
        esac
        ROOT="mold-${MOLD_VERSION}-${ARCH}-linux"
        INSTALL_DIR=$(mktemp -d "${RUNNER_TEMP}/mold.XXXXXX")
        ARCHIVE="${INSTALL_DIR}/mold.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/${ROOT}.tar.gz" \
          --output "$ARCHIVE"
        printf '%s  %s\n' "$SHA256" "$ARCHIVE" | sha256sum --check --strict
        # cc resolves -fuse-ld=mold through ld.mold on PATH. Extract only
        # the linker and its alias, after validating the whole archive.
        tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" --strip-components=2 \
          "$ROOT/bin/mold" "$ROOT/bin/ld.mold"
        rm "$ARCHIVE"
        "$INSTALL_DIR/mold" --version
        printf '%s\n' "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies
      uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-on-failure: true
        key: ${{ inputs.cache-key }}
