version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # deadpool 0.13 cannot be adopted until deadpool-postgres releases a
      # 0.13-compatible version (latest is 0.14.1, still requires deadpool ^0.12).
      # Bumping our direct dep produces a split lockfile and breaks type
      # compatibility on PoolConfig.queue_mode / Runtime::Tokio1.
      - dependency-name: "deadpool"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # jiff 1.0 cannot be adopted until postgres-types offers a jiff 1.x
      # feature (latest only has with-jiff-0_1 / with-jiff-0_2); without it
      # Timestamp loses its ToSql/FromSql impls in the database crate.
      - dependency-name: "jiff"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
