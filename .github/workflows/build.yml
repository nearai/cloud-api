name: Build & Deploy
on:
  workflow_dispatch:
    inputs:
      force_staging:
        description: 'Force push to staging even during freeze window'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

# Serialize builds per ref so :latest is pushed and the staging dispatch fires in commit
# order. queue: max keeps every pending run (FIFO) instead of GitHub's default of replacing
# queued runs, so no commit is skipped and every one still gets its staging-stamped tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/cloud-api

jobs:
  reproducible-docker-image:
    name: Reproducible Docker Image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to Docker registry
        uses: docker/login-action@3864d6aed8ff134b2ed894ce00c87695c709c870
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract image tags from GitHub ref (branch or tag)
        env:
          INPUT_FORCE_STAGING: ${{ github.event.inputs.force_staging }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            TAG=${GITHUB_REF_NAME#v}
            echo "Using '${TAG}' image tag for ${GITHUB_REF_NAME} tag"
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            TAG=$(if [[ "${GITHUB_REF_NAME}" == 'main' ]]; then echo 'latest'; else echo 'dev'; fi)
            echo "Using '${TAG}' image tag for ${GITHUB_REF_NAME} branch"
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          if [ -z "${TAG}" ]; then
            echo "Unable to parse image tag from ${GITHUB_REF_TYPE}: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "IMAGE_REFERENCE=${REGISTRY}/${IMAGE_REPOSITORY}:${TAG}" >> "$GITHUB_ENV"

          # On main branch, also promote to staging for continuous integration
          # Skip staging tag on Tuesday (2) and Wednesday (3) — staging is frozen
          # for prod-candidate testing until Thursday promotion
          if [[ "${GITHUB_REF_NAME}" == 'main' ]]; then
            FORCE_STAGING="${INPUT_FORCE_STAGING}"
            DAY_OF_WEEK=$(date -u +%u)
            if [[ "$DAY_OF_WEEK" -ge 2 && "$DAY_OF_WEEK" -le 3 ]] && [[ "$FORCE_STAGING" != 'true' ]]; then
              echo "Staging frozen (day $DAY_OF_WEEK) — skipping :staging tag (use force_staging to override)"
            else
              echo "ALSO_TAG_STAGING=true" >> "$GITHUB_ENV"
            fi
          fi

      # This VM is disposable. Remove unrelated SDKs and preloaded images
      # before the Rust build creates BuildKit layers and OCI archives.
      - name: Free disk space for image builds
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Build and push reproducible image
        run: |
          ./build-image.sh --push "${IMAGE_REFERENCE}"

      - name: Get image digest
        run: |
          DIGEST=$(skopeo inspect oci-archive:./oci.tar | jq -r '.Digest')
          if [ -z "${DIGEST}" ]; then
            echo "Failed to get image digest from OCI archive" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      # The deploy repository and its dispatch credentials come from secrets (masked in logs). The token is
      # minted from a GitHub App installed only on the deploy repository and is scoped to it. Both happen
      # before :staging moves, so a missing setting or a broken install never moves :staging without a deploy.
      - name: Check the staging dispatch settings
        if: env.ALSO_TAG_STAGING == 'true'
        env:
          DEPLOY_REPO_OWNER: ${{ secrets.DEPLOY_REPO_OWNER }}
          DEPLOY_REPO_NAME: ${{ secrets.DEPLOY_REPO_NAME }}
          DEPLOY_DISPATCH_CLIENT_ID: ${{ secrets.DEPLOY_DISPATCH_CLIENT_ID }}
          DEPLOY_DISPATCH_APP_KEY: ${{ secrets.DEPLOY_DISPATCH_APP_KEY }}
        run: |
          missing=0
          for v in DEPLOY_REPO_OWNER DEPLOY_REPO_NAME DEPLOY_DISPATCH_CLIENT_ID DEPLOY_DISPATCH_APP_KEY; do
            if [ -z "${!v//[[:space:]]/}" ]; then
              echo "::error::Secret ${v} is not set"
              missing=1
            fi
          done
          for v in DEPLOY_REPO_OWNER DEPLOY_REPO_NAME; do
            if ! [[ "${!v}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Secret ${v} must match ^[A-Za-z0-9._-]+\$"
              missing=1
            fi
          done
          if [[ "$DEPLOY_DISPATCH_APP_KEY" != *"-----BEGIN"*"PRIVATE KEY-----"* ]]; then
            echo "::error::Secret DEPLOY_DISPATCH_APP_KEY is not a PEM private key"
            missing=1
          fi
          if ! [[ "$DEPLOY_DISPATCH_CLIENT_ID" =~ ^Iv[0-9A-Za-z.]+$ ]]; then
            echo "::error::Secret DEPLOY_DISPATCH_CLIENT_ID is not a GitHub App client ID"
            missing=1
          fi
          exit "$missing"

      - name: Mint a dispatch token for the deploy repository
        if: env.ALSO_TAG_STAGING == 'true'
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPLOY_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_DISPATCH_APP_KEY }}
          owner: ${{ secrets.DEPLOY_REPO_OWNER }}
          repositories: ${{ secrets.DEPLOY_REPO_NAME }}
          permission-contents: write

      - name: Tag staging for continuous integration
        if: env.ALSO_TAG_STAGING == 'true'
        run: |
          STAGING_REF="${REGISTRY}/${IMAGE_REPOSITORY}:staging"
          # Immutable date+sha staging tag for rollback (format: staging-YYYYMMDD-<shortsha>)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          STAMP=$(date -u +%Y%m%d)
          STAGING_STAMPED_REF="${REGISTRY}/${IMAGE_REPOSITORY}:staging-${STAMP}-${SHORT_SHA}"
          skopeo copy oci-archive:./oci.tar "docker://${STAGING_REF}"
          skopeo copy oci-archive:./oci.tar "docker://${STAGING_STAMPED_REF}"
          echo "STAGING_REFERENCE=${STAGING_REF}" >> "$GITHUB_ENV"
          echo "STAGING_STAMPED_REFERENCE=${STAGING_STAMPED_REF}" >> "$GITHUB_ENV"

      - name: Trigger staging deployment
        if: env.ALSO_TAG_STAGING == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: ${{ secrets.DEPLOY_REPO_OWNER }}/${{ secrets.DEPLOY_REPO_NAME }}
          event-type: deploy-cloud-api-stg

      - name: Generate build summary
        run: |
          {
            echo "## cloud-api docker image"
            echo ""
            echo "- tag: \`${IMAGE_REFERENCE}\`"
            echo "- digest: \`${IMAGE_DIGEST}\`"
            echo "- sigstore: https://search.sigstore.dev/?hash=${IMAGE_DIGEST}"
            if [[ "${ALSO_TAG_STAGING}" == 'true' ]]; then
              echo "- staging: \`${STAGING_REFERENCE}\`"
              echo "- staging (stamped): \`${STAGING_STAMPED_REFERENCE}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
