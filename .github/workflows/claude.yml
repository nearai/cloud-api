name: Claude Code

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] Explicit write-permission check precedes checkout and Claude.
    types: [created]  # Listen for @claude in PR comments (non-review tasks)
  pull_request_review_comment:
    types: [created]  # Listen for @claude in inline code comments

jobs:
  claude:
    # Run if: @claude in PR comment (WITHOUT review keywords) OR @claude in inline comment
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       !contains(github.event.comment.body, '@claude review') &&
       !contains(github.event.comment.body, '@claude code review')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Require repository write permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor
            });
            if (!['admin', 'write', 'maintain'].includes(access.permission)) {
              throw new Error('Code review requires repository write permission.');
            }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      # Keep the CLI version aligned with the pinned claude-code-action.
      # SHA256 is from its signed release manifest (see code.claude.com/docs/en/setup).
      - name: Install verified Claude CLI
        id: claude-cli
        env:
          DISABLE_UPDATES: '1'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          version=2.1.322
          sha256=bfb3703ad5380242328459bc62ada4bde8ae7ba57c6e1eeadb9c00e08874c478
          install_dir=$(mktemp -d "${RUNNER_TEMP}/claude.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${version}/linux-x64/claude" \
            --output "$install_dir/claude"
          printf '%s  %s\n' "$sha256" "$install_dir/claude" | sha256sum --check --strict
          chmod 755 "$install_dir/claude"
          "$install_dir/claude" --version
          printf 'path=%s/claude\n' "$install_dir" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        env:
          DISABLE_UPDATES: '1'
        with:
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

