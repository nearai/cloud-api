name: Rollback Image

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Target prod tag to roll back to (e.g. prod-20260101-abc1234). Leave empty to auto-resolve to the most recent prod-* tag whose digest differs from current :prod."
        required: false
        type: string
        default: ""
      confirm:
        description: "Type ROLLBACK to confirm production rollback"
        required: true
        type: string

# Serialize all :prod image mutations (rollback and promote) so two concurrent
# runs — or a rollback racing a Thursday promotion — cannot split-brain the
# :prod tag and the audit tags. cancel-in-progress: false queues rather than
# cancels so neither operation is silently lost.
concurrency:
  group: prod-image-mutation
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: cloud-api
  IMAGE: docker.io/${{ vars.DOCKER_REGISTRY_USER }}/cloud-api

jobs:
  preflight:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirm input
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ROLLBACK" ]; then
            echo "::error::Confirmation failed. Set 'confirm' input to ROLLBACK to proceed."
            exit 1
          fi

  rollback-prod:
    name: Roll back :prod
    needs: preflight
    permissions:
      contents: write # Create the rollback audit release.
    runs-on: ubuntu-latest
    environment: production
    outputs:
      target_tag: ${{ steps.resolve.outputs.target_tag }}
      target_digest: ${{ steps.resolve.outputs.target_digest }}
      previous_digest: ${{ steps.resolve.outputs.previous_digest }}
      audit_tag: ${{ steps.resolve.outputs.audit_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to Docker registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Install skopeo and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      # Resolve target prod-* tag (auto or explicit) and capture the digest
      # currently published as :prod so the deploy step has an addressable
      # 'before' state and the workflow summary records both digests.
      - name: Resolve target tag and digest
        id: resolve
        env:
          VAR_DOCKER_REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_USER }}
          TARGET_TAG_INPUT: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          TARGET_TAG="$TARGET_TAG_INPUT"

          CURRENT_DIGEST=$(skopeo inspect "docker://${IMAGE}:prod" 2>/dev/null | jq -r '.Digest' || true)
          if [ -z "$CURRENT_DIGEST" ] || [ "$CURRENT_DIGEST" = "null" ]; then
            echo "::error::Failed to inspect current :prod digest (tag may not exist)"
            exit 1
          fi
          echo "previous_digest=${CURRENT_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Current :prod digest: ${CURRENT_DIGEST}"

          if [ -z "$TARGET_TAG" ]; then
            echo "No target_tag provided; auto-resolving previous prod-* tag"
            # Paginate Docker Hub tags. Bound iterations and per-call time so a
            # malformed cursor or stuck pagination can't hang the workflow.
            TAGS_JSON=""
            PAGE_URL="https://hub.docker.com/v2/namespaces/${VAR_DOCKER_REGISTRY_USER}/repositories/${IMAGE_NAME}/tags?page_size=100"
            MAX_PAGES=50
            PAGE_COUNT=0
            while [ -n "$PAGE_URL" ] && [ "$PAGE_URL" != "null" ] && [ "$PAGE_COUNT" -lt "$MAX_PAGES" ]; do
              RESP=$(curl -fsS --max-time 30 --retry 2 --retry-delay 2 "$PAGE_URL")
              TAGS_JSON="${TAGS_JSON}$(echo "$RESP" | jq -c '.results[]')"$'\n'
              PAGE_URL=$(echo "$RESP" | jq -r '.next')
              PAGE_COUNT=$((PAGE_COUNT + 1))
            done
            if [ "$PAGE_COUNT" -ge "$MAX_PAGES" ]; then
              echo "::warning::Reached MAX_PAGES=${MAX_PAGES} while listing tags; auto-resolve may have missed older candidates."
            fi
            # Sort by Docker Hub last_updated (push time). Same-day promotions
            # share the YYYYMMDD prefix and tiebreak by short-sha, which is not
            # chronological, so name sort alone would pick the wrong one.
            TARGET_TAG=$(echo "$TAGS_JSON" | jq -rs --arg cur "$CURRENT_DIGEST" '
              [.[] | select(.name | test("^prod-[0-9]{8}-[0-9a-f]{7}$")) | {name, digest, last_updated}]
              | sort_by(.last_updated // .name) | reverse
              | map(select(.digest != $cur)) | .[0].name // empty
            ')
            if [ -z "$TARGET_TAG" ]; then
              echo "::error::No previous prod-* tag found whose digest differs from current :prod. Specify target_tag explicitly."
              exit 1
            fi
            echo "Auto-resolved previous tag: ${TARGET_TAG}"
          fi

          if ! echo "$TARGET_TAG" | grep -Eq '^prod-[0-9]{8}-[0-9a-f]{7}$'; then
            echo "::error::target_tag '${TARGET_TAG}' does not match expected format prod-YYYYMMDD-<shortsha>"
            exit 1
          fi

          TARGET_DIGEST=$(skopeo inspect "docker://${IMAGE}:${TARGET_TAG}" 2>/dev/null | jq -r '.Digest' || true)
          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "null" ]; then
            echo "::error::Tag ${TARGET_TAG} not found on Docker Hub"
            exit 1
          fi
          if [ "$TARGET_DIGEST" = "$CURRENT_DIGEST" ]; then
            echo "::error::Target tag ${TARGET_TAG} already matches current :prod digest (${CURRENT_DIGEST}). Nothing to do."
            exit 1
          fi

          STAMP=$(date -u +%Y%m%d-%H%M%S)
          AUDIT_TAG="prod-rollback-${STAMP}-from-${TARGET_TAG#prod-}"

          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_digest=${TARGET_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "audit_tag=${AUDIT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved target: ${TARGET_TAG} @ ${TARGET_DIGEST}"
          echo "Audit tag: ${AUDIT_TAG}"

      # Copy from the resolved digest (not the tag) so the bytes pushed to
      # :prod and the audit tag are provably identical, regardless of any
      # concurrent registry write that might race the source tag.
      #
      # Separated into two steps so a failure pushing the audit tag does not
      # prevent the redeploy job from running — :prod is already re-pointed at
      # this stage and the fleet must be redeployed regardless.
      - name: Re-tag :prod
        id: retag-prod
        env:
          STEP_RESOLVE_TARGET_DIGEST: ${{ steps.resolve.outputs.target_digest }}
        run: |
          set -euo pipefail
          skopeo copy "docker://${IMAGE}@${STEP_RESOLVE_TARGET_DIGEST}" "docker://${IMAGE}:prod"

      - name: Push audit tag
        continue-on-error: true
        env:
          STEP_RESOLVE_TARGET_DIGEST: ${{ steps.resolve.outputs.target_digest }}
          STEP_RESOLVE_AUDIT_TAG: ${{ steps.resolve.outputs.audit_tag }}
        run: |
          set -euo pipefail
          skopeo copy "docker://${IMAGE}@${STEP_RESOLVE_TARGET_DIGEST}" "docker://${IMAGE}:${STEP_RESOLVE_AUDIT_TAG}"

      - name: Output digest summary
        env:
          STEP_RESOLVE_TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          STEP_RESOLVE_TARGET_DIGEST: ${{ steps.resolve.outputs.target_digest }}
          STEP_RESOLVE_PREVIOUS_DIGEST: ${{ steps.resolve.outputs.previous_digest }}
          STEP_RESOLVE_AUDIT_TAG: ${{ steps.resolve.outputs.audit_tag }}
        run: |
          {
            echo "## Rollback: :prod → ${STEP_RESOLVE_TARGET_TAG}"
            echo ""
            echo "- target tag: \`${STEP_RESOLVE_TARGET_TAG}\`"
            echo "- target digest: \`${STEP_RESOLVE_TARGET_DIGEST}\`"
            echo "- previous :prod digest: \`${STEP_RESOLVE_PREVIOUS_DIGEST}\`"
            echo "- audit tag: \`${STEP_RESOLVE_AUDIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GH release tag mirrors the audit docker tag for easy correlation.
      # edit-or-create keeps same-second re-runs idempotent. Never marks the
      # rollback release as 'latest' — :prod has moved backwards, so the GH
      # 'latest' pointer should keep pointing at the most recent forward
      # promotion's release, not this one.
      - name: Create GitHub release
        env:
          STEP_RESOLVE_AUDIT_TAG: ${{ steps.resolve.outputs.audit_tag }}
          STEP_RESOLVE_TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          STEP_RESOLVE_TARGET_DIGEST: ${{ steps.resolve.outputs.target_digest }}
          STEP_RESOLVE_PREVIOUS_DIGEST: ${{ steps.resolve.outputs.previous_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${STEP_RESOLVE_AUDIT_TAG}"
          NOTES=$(cat <<EOF
          ## Production Rollback

          - **Image**: \`${IMAGE}:prod\`
          - **Rolled back to**: \`${IMAGE}:${STEP_RESOLVE_TARGET_TAG}\`
          - **Audit tag**: \`${IMAGE}:${TAG}\`
          - **New :prod digest**: \`${STEP_RESOLVE_TARGET_DIGEST}\`
          - **Previous :prod digest**: \`${STEP_RESOLVE_PREVIOUS_DIGEST}\`
          - **Sigstore**: https://search.sigstore.dev/?hash=${STEP_RESOLVE_TARGET_DIGEST}
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Production Rollback ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Production Rollback ${TAG}" --notes "$NOTES"
          fi
          echo "- release: [\`${TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"

  trigger-redeploy:
    name: Trigger the production redeploy
    needs: rollback-prod
    # Default GHA behaviour: run only when rollback-prod succeeds.
    # The audit-tag step uses continue-on-error so it cannot fail the job,
    # ensuring a transient registry blip on the audit copy doesn't block the
    # redeploy. The :prod retag step has no continue-on-error, so a retag
    # failure correctly blocks the redeploy.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The production deploy re-reads :prod, which was just re-pointed at the rolled-back digest. It is
      # triggered with a redeploy-cloud-api-prod event that carries no payload; the receiving workflow runs
      # it like its scheduled run (all gates apply). The deploy repository and the GitHub App credentials
      # come from secrets (masked in logs); the token is scoped to the deploy repository.
      - name: Check the dispatch settings
        env:
          DEPLOY_REPO_OWNER: ${{ secrets.DEPLOY_REPO_OWNER }}
          DEPLOY_REPO_NAME: ${{ secrets.DEPLOY_REPO_NAME }}
          DEPLOY_DISPATCH_CLIENT_ID: ${{ secrets.DEPLOY_DISPATCH_CLIENT_ID }}
          DEPLOY_DISPATCH_APP_KEY: ${{ secrets.DEPLOY_DISPATCH_APP_KEY }}
        run: |
          missing=0
          for v in DEPLOY_REPO_OWNER DEPLOY_REPO_NAME DEPLOY_DISPATCH_CLIENT_ID DEPLOY_DISPATCH_APP_KEY; do
            if [ -z "${!v//[[:space:]]/}" ]; then
              echo "::error::Secret ${v} is not set"
              missing=1
            fi
          done
          for v in DEPLOY_REPO_OWNER DEPLOY_REPO_NAME; do
            if ! [[ "${!v}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Secret ${v} must match ^[A-Za-z0-9._-]+\$"
              missing=1
            fi
          done
          if [[ "$DEPLOY_DISPATCH_APP_KEY" != *"-----BEGIN"*"PRIVATE KEY-----"* ]]; then
            echo "::error::Secret DEPLOY_DISPATCH_APP_KEY is not a PEM private key"
            missing=1
          fi
          if ! [[ "$DEPLOY_DISPATCH_CLIENT_ID" =~ ^Iv[0-9A-Za-z.]+$ ]]; then
            echo "::error::Secret DEPLOY_DISPATCH_CLIENT_ID is not a GitHub App client ID"
            missing=1
          fi
          exit "$missing"

      - name: Mint a dispatch token for the deploy repository
        id: dispatch-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.DEPLOY_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_DISPATCH_APP_KEY }}
          owner: ${{ secrets.DEPLOY_REPO_OWNER }}
          repositories: ${{ secrets.DEPLOY_REPO_NAME }}
          permission-contents: write

      - name: Trigger the production redeploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: ${{ secrets.DEPLOY_REPO_OWNER }}/${{ secrets.DEPLOY_REPO_NAME }}
          event-type: redeploy-cloud-api-prod

      - name: Summary
        env:
          NEEDS_ROLLBACK_PROD_TARGET_TAG: ${{ needs.rollback-prod.outputs.target_tag }}
          NEEDS_ROLLBACK_PROD_TARGET_DIGEST: ${{ needs.rollback-prod.outputs.target_digest }}
          NEEDS_ROLLBACK_PROD_AUDIT_TAG: ${{ needs.rollback-prod.outputs.audit_tag }}
        run: |
          {
            echo "## Redeploy dispatched"
            echo ""
            echo "- target tag: \`${NEEDS_ROLLBACK_PROD_TARGET_TAG}\`"
            echo "- target digest: \`${NEEDS_ROLLBACK_PROD_TARGET_DIGEST}\`"
            echo "- audit tag: \`${NEEDS_ROLLBACK_PROD_AUDIT_TAG}\`"
            echo ""
            echo "Triggered the production redeploy (redeploy-cloud-api-prod)."
            echo ""
            echo "Verify when deploy completes: https://cloud-api.near.ai/v1/health"
          } >> "$GITHUB_STEP_SUMMARY"
