name: Security audit

on:
  push:
    branches:
      - 'main'
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC

# Cancel superseded PR runs only; main pushes and the daily cron each get a
# unique group so they never queue behind or cancel one another.
concurrency:
  group: security-audit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security_audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # rustsec/audit-check reports advisories as issues.
      checks: write # rustsec/audit-check publishes its check result.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Install cargo-audit with locked dependencies
        run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo_deny_advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Install the prebuilt cargo-deny binary from GitHub releases instead of
      # EmbarkStudios/cargo-deny-action, which builds a container from an
      # unauthenticated Docker Hub pull and fails on Docker Hub's rate limit.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - name: Run cargo deny advisories
        run: cargo deny --all-features check advisories
