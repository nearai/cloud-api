name: Tests

# NOTE: deliberately NO top-level `paths:` filter. "Test Suite" is a required
# status check (branch ruleset), and a path-filtered workflow that is skipped
# leaves that check perpetually "Expected", which blocks every PR that does not
# touch Rust files (CI, build scripts, docs) until an admin bypasses it. Instead
# the workflow always runs and the `changes` job below decides whether the
# expensive Rust jobs actually execute — so "Test Suite" always reports a result.
on:
  push:
    branches: [ main, develop ]
  # Include stacked PRs targeting another feature branch.
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the previous run, so cancel it instead of letting
# it consume runners unnecessarily. Non-PR runs get a unique group (run_id): a shared
# group would serialize main/develop pushes and GitHub would cancel the pending
# run whenever a third arrives, leaving that commit untested.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0  # Faster CI builds
  # sccache reuses object files within each job. swatinem/rust-cache restores
  # Cargo dependencies and target/ between runs; the hosted runner's local
  # sccache directory is discarded when the job ends.
  RUSTC_WRAPPER: sccache
  # Use the mold linker on Linux for much faster linking of the large test
  # binaries (5-crate workspace, ~400 deps). We pass -fuse-ld=mold through
  # the default cc driver rather than setting mold as the linker directly,
  # because mold is a linker, not a driver, and does not understand gcc
  # driver flags like -m64.
  #
  # NOTE: Setting RUSTFLAGS here replaces the target.cfg.rustflags from
  # .cargo/config.toml (cargo treats these as mutually exclusive sources).
  # That is intentional for CI: the dropped flags (--remap-path-prefix,
  # --build-id=none, --hash-style=gnu, --no-undefined) are reproducibility-
  # only and irrelevant for tests. We keep -C debuginfo=0 for faster test
  # compiles. The Docker reproducible build does not set RUSTFLAGS, so it
  # keeps using the full .cargo/config.toml rustflags with ld.
  RUSTFLAGS: "-C debuginfo=0 -C link-arg=-fuse-ld=mold"

jobs:
  # Decide whether the Rust test jobs need to run. Covers the same path set the
  # old `on:` filter used, plus rust-toolchain.toml and .cargo/config.toml (which
  # affect the build but the old filter omitted). Fails safe: anything we can't
  # classify (new branch, detection error) is treated as "run the tests".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # need history to diff the PR / push range

      - name: Detect Rust-relevant changes
        id: detect
        env:
          EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          EVENT="${GITHUB_EVENT_NAME}"
          CHANGED=""
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED=$(git diff --name-only \
              "${EVENT_PULL_REQUEST_BASE_SHA}...${EVENT_PULL_REQUEST_HEAD_SHA}" 2>/dev/null)
          elif [ "$EVENT" = "push" ] && \
               [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${EVENT_BEFORE}" "${GITHUB_SHA}" 2>/dev/null)
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # Default to running tests; only skip when we have a concrete file list
          # and none of it is Rust-relevant.
          RUST=true
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qE \
            '(\.rs$|(^|/)Cargo\.(toml|lock)$|^crates/[^/]+/src/.*\.json$|^scripts/apply-schema\.sh$|^scripts/cloud-platform-schema\.env$|^\.github/workflows/test\.yml$|^\.github/actions/setup-rust-ci/|^\.config/nextest\.toml$|^rust-toolchain\.toml$|^\.cargo/config\.toml$|^scripts/check_dep_guards\.sh$)'; then
            RUST=false
          fi
          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "Decision: run Rust test jobs = $RUST"

  lint:
    name: Lint
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # Every event, including fork pull requests, uses a fresh hosted VM.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Rust CI
      uses: $/.github/actions/setup-rust-ci
      with:
        cache-key: lint
        components: rustfmt, clippy

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    # Each hosted job restores its own Rust dependency cache.
    - name: Run cargo clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Dependency guards
      run: bash scripts/check_dep_guards.sh

  # Unit tests (library + binary tests) run without PostgreSQL: the in-crate
  # #[test] functions use mocks and do not establish real DB connections.
  unit-test:
    name: Unit tests
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Rust CI
      uses: $/.github/actions/setup-rust-ci
      with:
        cache-key: unit

    - name: Run unit tests
      run: cargo nextest run --lib --bins
      env:
        # This job has no `environment:`, so the "Cloud API test env" secrets
        # were never available here; keep the variables set (some config
        # loaders panic when unset) but empty, without referencing secrets.
        POSTGRES_PRIMARY_APP_ID: ""
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        DATABASE_NAME: platform_api
        DATABASE_USERNAME: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_MAX_CONNECTIONS: 5
        DATABASE_TLS_ENABLED: "false"
        MODEL_DISCOVERY_SERVER_URL: ""
        MODEL_DISCOVERY_API_KEY: ""
        AUTH_ADMIN_EMAILS: ""
        AUTH_ENCODING_KEY: ""
        BRAVE_SEARCH_PRO_API_KEY: ""
        DEV: "true"

  # vLLM provider integration tests. Uses MockProvider by default
  # (USE_REAL_VLLM is not set), so these run without external dependencies
  # and without PostgreSQL. Kept as a separate job so a flake here doesn't
  # block the e2e suite.
  integration-test:
    name: Integration tests
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Rust CI
      uses: $/.github/actions/setup-rust-ci
      with:
        cache-key: integration

    - name: Run integration tests
      # MockProvider unless USE_REAL_VLLM is set; the real-vLLM test is #[ignore].
      run: cargo nextest run --test integration_tests

  # End-to-end tests. All e2e tests are compiled into a single binary
  # (tests/e2e_all/) for faster linking. Isolation comes from UUID-scoped
  # orgs/workspaces/keys on a shared database, not separate databases.
  # A nextest setup script creates that database and applies the schema exactly once, then
  # e2e concurrency is capped by .config/nextest.toml at 4 active tests. Most
  # pools are capped at 4 connections; even tests with a second pool leave
  # PostgreSQL headroom for runner-side services.
  e2e-test:
    name: E2E tests
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pulls the cloud-platform schema image (scripts/cloud-platform-schema.env).
      packages: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_api
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
        ports:
          # E2E clients run on the host; keep the temporary test database local. Docker picks
          # the host port, so concurrent jobs on a shared runner host don't collide.
          - 127.0.0.1::5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Rust CI
      uses: $/.github/actions/setup-rust-ci
      with:
        cache-key: e2e

    # The schema comes from nearai/cloud-platform. The database helpers and the nextest
    # bootstrap run scripts/apply-schema.sh, which pulls the pinned image. The login goes into
    # a job-private DOCKER_CONFIG, so no credential is left in the shared runner's docker
    # config; the cleanup step at the end of the job removes it.
    - name: Log in to GHCR for the cloud-platform schema image (job-private config)
      run: |
        docker_config="$RUNNER_TEMP/docker-config-e2e"
        mkdir -p "$docker_config"
        chmod 700 "$docker_config"
        echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
        DOCKER_CONFIG="$docker_config" bash -c 'echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin'
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run typed-query, credit, analytics, session, and binding regressions
      run: |
        cargo test --locked -p database --test hot_path_typed_queries --test billing_typed_queries --test credit_allocation --test session_rotation --test staking_wallet_binding --test organization_credit_metrics -- --test-threads=4
        # Fault injection changes shared table constraints; isolate this binary.
        cargo test --locked -p database --test credit_transfers -- --test-threads=1
      env:
        PGHOST: localhost
        PGPORT: ${{ job.services.postgres.ports['5432'] }}
        PGDATABASE: platform_api
        PGUSER: postgres
        PGPASSWORD: postgres

    - name: Run e2e tests
      run: cargo nextest run --test e2e_all
      # No secrets: the e2e harness builds its config in crates/api/tests/common (mock auth
      # key, mock inference providers) and reads no auth or discovery secrets.
      env:
        # The app builds the Brave provider at startup and panics without a key; no e2e test
        # calls the real Brave API, so a placeholder is enough.
        BRAVE_SEARCH_PRO_API_KEY: e2e-placeholder
        DATABASE_HOST: localhost
        DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
        DATABASE_NAME: platform_api
        DATABASE_USERNAME: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_MAX_CONNECTIONS: 5
        DATABASE_TLS_ENABLED: "false"
        TEST_DATABASE_NAME: platform_api_e2e
        RUST_LOG: debug
        DEV: "true"

    - name: Remove the job-private GHCR login
      if: always()
      run: rm -rf "$RUNNER_TEMP/docker-config-e2e"

  script-test:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test synthetic rollout verification
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Test PR review comment formatter
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # Aggregates all test jobs into a single required status check. The branch
  # ruleset requires "Test Suite", so this job MUST always run and always report
  # a result (note `if: always()` plus no `paths:` filter on the workflow) —
  # otherwise the required check stays "Expected" forever and blocks the PR.
  # When there are no Rust-relevant changes the test jobs are skipped and this
  # gate passes; otherwise every test job must have succeeded.
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-test, integration-test, e2e-test, script-test]
    if: always()
    steps:
      - name: Check all tests passed
        env:
          NEEDS_CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_SCRIPT_TEST_RESULT: ${{ needs.script-test.result }}
          NEEDS_CHANGES_RUST: ${{ needs.changes.outputs.rust }}
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          NEEDS_INTEGRATION_TEST_RESULT: ${{ needs.integration-test.result }}
          NEEDS_E2E_TEST_RESULT: ${{ needs.e2e-test.result }}
        run: |
          # Fail closed if change detection itself failed — we can't safely
          # conclude tests were unnecessary.
          if [[ "${NEEDS_CHANGES_RESULT}" != "success" ]]; then
            echo "Change-detection job did not succeed (${NEEDS_CHANGES_RESULT}); failing closed."
            exit 1
          fi

          if [[ "${NEEDS_SCRIPT_TEST_RESULT}" != "success" ]]; then
            echo "Script tests did not succeed; failing closed."
            exit 1
          fi

          if [[ "${NEEDS_CHANGES_RUST}" != "true" ]]; then
            echo "No Rust-relevant changes — test jobs were skipped. Nothing to verify."
            exit 0
          fi

          failed=0
          for jr in "Lint=${NEEDS_LINT_RESULT}" \
                    "Unit tests=${NEEDS_UNIT_TEST_RESULT}" \
                    "Integration tests=${NEEDS_INTEGRATION_TEST_RESULT}" \
                    "E2E tests=${NEEDS_E2E_TEST_RESULT}"; do
            name="${jr%%=*}"; res="${jr#*=}"
            if [[ "$res" != "success" ]]; then
              echo "FAIL  ${name}: ${res}"
              failed=1
            else
              echo "OK    ${name}: success"
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more test jobs did not succeed"
            exit 1
          fi
          echo "All test jobs passed"
