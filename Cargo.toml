[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.0"
authors = ["support@near.ai"]
license = "MIT"
description = "NEAR AI Cloud API"

[profile.dev]
# Disable incremental compilation (release is non-incremental by default).
# Set CARGO_INCREMENTAL=1 to opt back in for local iteration.
incremental = false
