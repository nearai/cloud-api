[workspace]
members = ["crates/*"]
resolver = "2"
exclude = ["vendor/dstack-sdk", "vendor/near-api"]

[workspace.package]
edition = "2021"
version = "0.0.0"
authors = ["support@near.ai"]
license = "MIT"
description = "NEAR AI Cloud API"

# Client-only dstack-sdk patch removes the Alloy/Ethereum dependency chain
# affected by RUSTSEC-2026-0387. See vendor/dstack-sdk/README.md for provenance.
# Remove when an upstream release supports clients without the affected tree.
[patch.crates-io]
dstack-sdk = { path = "vendor/dstack-sdk" }

# near-api 0.8.6 requires vulnerable zstd 0.13; patch only its dependency floor.
# See vendor/near-api/README.md for provenance and removal criteria.
near-api = { path = "vendor/near-api" }
