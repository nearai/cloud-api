[workspace]
members = ["crates/*"]
resolver = "2"
exclude = ["vendor/dstack-sdk"]

[workspace.package]
edition = "2021"
version = "0.0.0"
authors = ["support@near.ai"]
license = "MIT"
description = "NEAR AI Cloud API"

# Client-only dstack-sdk patch removes the Alloy/Ethereum dependency chain
# affected by RUSTSEC-2026-0387. See vendor/dstack-sdk/README.md for provenance.
# Remove when an upstream release supports clients without the affected tree.
[patch.crates-io]
dstack-sdk = { path = "vendor/dstack-sdk" }

# Upgrade zstd until an upstream near-api release includes near/near-api-rs#152.
near-api = { git = "https://github.com/nearai/near-api-rs", rev = "9ee3848688b2eee698cd132c7e43bea061af8f0b" }
