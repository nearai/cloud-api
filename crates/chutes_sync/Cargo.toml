[package]
name = "chutes_sync"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Daily Chutes measurement sync: probe live Chutes TEE instances and propose pins for published, verified-live measurement rows"

[dependencies]
services = { path = "../services" }
inference_providers = { path = "../inference_providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2.0"
hex = "0.4"
chrono = "0.4"
getrandom = "0.4"

[dev-dependencies]
wiremock = "0.6"
