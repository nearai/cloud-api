[package]
name = "placement"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Smart-routing decision logic: picks a replica slot from signed host load frames"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "3.0"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
thiserror = "2.0"
hmac = "0.13"
rand = "0.10"
arc-swap = "1.9.1"

[dev-dependencies]
proptest = "1.9.0"
