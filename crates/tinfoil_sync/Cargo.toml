[package]
name = "tinfoil_sync"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Daily Tinfoil measurement sync: observe the live router, verify its Sigstore release attestations, and propose pins for rows both agree on"

[dependencies]
services = { path = "../services" }
inference_providers = { path = "../inference_providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"] }
thiserror = "2.0"
anyhow = "1.0"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
# Sigstore verification lives in `tinfoil_provenance`, the only crate allowed
# to depend on `sigstore-verify` (enforced by scripts/check_dep_guards.sh); the
# runtime uses it too. This crate is CI tooling and is never a dependency of
# `api` or `services`.
tinfoil_provenance = { path = "../tinfoil_provenance" }

[dev-dependencies]
wiremock = "0.6"
rcgen = "0.14"
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
