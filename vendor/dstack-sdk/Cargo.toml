# Derived from the published dstack-sdk 0.1.3 manifest.
# See README.md for provenance and the client-only patch.

[package]
edition = "2021"
name = "dstack-sdk"
version = "0.1.3"
authors = ["Encifher <encifher@rizelabs.io>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "This crate provides a rust client for communicating with dstack"
license = "MIT"

[lib]
name = "dstack_sdk"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0.97"
default-features = false

[dependencies.bon]
version = "3.4.0"
default-features = false

[dependencies.dstack-sdk-types]
version = "0.1.3"
default-features = false

[dependencies.hex]
version = "0.4.3"
features = ["std"]
default-features = false

[dependencies.http]
version = "1.3.1"

[dependencies.http-client-unix-domain-socket]
version = "0.1.1"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "rustls-tls",
    "charset",
]
default-features = false

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
default-features = false

[dependencies.serde_json]
version = "1.0.140"
default-features = false

[dependencies.sha2]
version = "0.10.8"
default-features = false

[dependencies.x509-parser]
version = "0.16.0"
