[package]
name = "sev-snp-qvl"
version = "0.6.6"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls-vendored"] }
sev = { version = "=8.0.0", default-features = false, features = ["snp", "openssl"] }
tokio = { version = "1", features = ["rt", "time"] }
x509-parser = { version = "0.18", features = ["verify"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", features = ["ring"] }
pem = "3"

[dev-dependencies]
rcgen = "0.13"
time = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
